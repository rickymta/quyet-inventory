# Chạy toàn bộ ứng dụng:  docker compose up -d --build   →  http://localhost (nginx, cổng HTTP_PORT, mặc định 80)
# Bật HTTPS (Let's Encrypt): xem docker-compose.https.yml và scripts/https-init.sh
name: kiemke

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    image: kiemke-app:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongo:27017/kiemke
      PORT: 4000
      # Để trống = dùng bộ seed đi kèm trong image (server/seed/data), chỉ nạp ở lần chạy đầu khi CSDL còn trống.
      # Đặt đường dẫn (trong container) tới thư mục seed hoặc file sao lưu JSON để dùng nguồn khác.
      SEED_PATH: ${SEED_PATH:-}
      # Tài khoản quản trị tạo ở lần chạy đầu (khi chưa có tài khoản nào); đổi mật khẩu ngay sau khi đăng nhập
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123}
      # Khoá ký phiên đăng nhập; để trống = tự sinh và lưu trong CSDL
      JWT_SECRET: ${JWT_SECRET:-}
      # Luôn đứng sau nginx nên mặc định tin X-Forwarded-Proto (bật cờ Secure cho cookie khi qua HTTPS)
      TRUST_PROXY: ${TRUST_PROXY:-1}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health | grep -q '\"ok\":true'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      # Chỉ loopback của máy chủ, để chẩn đoán; người dùng vào qua nginx
      - "127.0.0.1:${APP_PORT:-8080}:4000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-_}
      # Chỉ thay ${SERVER_NAME}, giữ nguyên $host, $remote_addr... của nginx
      NGINX_ENVSUBST_FILTER: ^SERVER_NAME$$
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt:ro

volumes:
  mongo-data:
  certbot-www:
  letsencrypt:
