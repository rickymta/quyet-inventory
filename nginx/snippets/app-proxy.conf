# Dùng chung cho khối HTTP và HTTPS (nginx/snippets được gắn vào /etc/nginx/snippets, KHÔNG qua envsubst).
# Đặt include trong từng location vì add_header ở location sẽ thay thế add_header ở cấp server.

# Upstream qua biến + resolver nội bộ của Docker: nginx tra lại DNS khi container app được tạo lại (đổi IP),
# không bị 502 cho tới khi khởi động lại nginx.
resolver 127.0.0.11 valid=10s ipv6=off;
set $app_upstream http://app:4000;
proxy_pass $app_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Nối thêm IP khách vào cuối; Express (trust proxy = 1) chỉ tin phần tử do nginx thêm.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Luôn ghi đè bằng giao thức thật của kết nối tới nginx (http hoặc https), không chuyển tiếp giá trị do khách gửi.
proxy_set_header X-Forwarded-Proto $scheme;

# Ảnh/PDF gửi lên dạng JSON tới 100MB
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_connect_timeout 10s;
# Bật đệm body: nginx nhận trọn body (ghi đĩa tạm nếu lớn) rồi mới chuyển cho app, app không bị giữ kết nối bởi máy khách chậm.
proxy_request_buffering on;
proxy_buffering on;

# Header bảo mật cơ bản. Cố ý KHÔNG đặt CSP / X-Frame-Options; camera chỉ cho chính trang này (quét mã).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
